<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charley Duds - Blindtest</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #0284c7;
      --accent-orange: #ea580c;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--card-bg);
      padding: 1rem 1.5rem;
      border-bottom: 2px solid var(--accent-blue);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.4rem;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    h1 span {
      color: var(--accent-orange);
    }

    .dj-btn {
      background: transparent;
      border: 1px solid var(--accent-blue);
      color: var(--text-main);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .dj-btn:hover {
      background-color: var(--accent-blue);
    }

    main {
      flex: 1;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    h2 {
      margin-bottom: 1rem;
      font-size: 1.2rem;
      color: var(--accent-blue);
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    select, input[type="text"], input[type="number"], input[type="password"] {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    select:focus, input:focus {
      outline: 2px solid var(--accent-blue);
    }

    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background-color: var(--accent-orange);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
    }

    .btn-submit:hover {
      opacity: 0.9;
    }

    /* Modal DJ */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal-content {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 2rem;
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid var(--border-color);
    }

    .close-btn {
      float: right;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    th, td {
      padding: 0.75rem;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      color: var(--text-muted);
    }

    .score-controls {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .score-input {
      width: 70px !important;
      margin-bottom: 0 !important;
      padding: 0.4rem !important;
      text-align: center;
    }

    .btn-pts {
      background-color: var(--accent-blue);
      color: white;
      border: none;
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-quick {
      background-color: var(--border-color);
      color: var(--text-main);
      border: none;
      padding: 0.4rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .btn-quick:hover {
      background-color: var(--accent-orange);
    }

    .qr-container {
      text-align: center;
      margin-top: 1.5rem;
      padding: 1rem;
      background: white;
      border-radius: 8px;
      display: inline-block;
    }

    .hidden {
      display: none !important;
    }
  </style>

  <!-- Librairie QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

  <header>
    <h1>Charley Duds <span>Blindtest</span></h1>
    <button class="dj-btn" onclick="openDjModal()">🔐 Espace DJ</button>
  </header>

  <main>
    <!-- Section Joueur -->
    <div class="card" id="player-section">
      <h2>🎵 Envoyer une réponse</h2>
      <form id="answer-form" onsubmit="submitAnswer(event)">
        <label for="team-select">Choisissez votre équipe :</label>
        <select id="team-select" required>
          <option value="">-- Sélectionnez une équipe --</option>
        </select>

        <label for="player-answer">Votre proposition (Artiste / Titre) :</label>
        <input type="text" id="player-answer" placeholder="Ex: Daft Punk - One More Time" required autocomplete="off">

        <button type="submit" class="btn-submit">Envoyer la réponse</button>
      </form>
    </div>

    <!-- Section Classement Public -->
    <div class="card">
      <h2>🏆 Classement des Équipes</h2>
      <table id="public-leaderboard">
        <thead>
          <tr>
            <th>Rang</th>
            <th>Équipe</th>
            <th>Points</th>
          </tr>
        </thead>
        <tbody>
          <!-- Rempli en JS -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal Admin DJ -->
  <div class="modal" id="dj-modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeDjModal()">&times;</button>
      
      <!-- Étape 1 : Mot de passe -->
      <div id="dj-login">
        <h2>Accès Organisateur</h2>
        <label for="dj-pass">Mot de passe admin :</label>
        <input type="password" id="dj-pass" placeholder="Entrez le code secret">
        <button class="btn-submit" onclick="checkDjAuth()">Valider</button>
      </div>

      <!-- Étape 2 : Panneau de contrôle -->
      <div id="dj-dashboard" class="hidden">
        <h2>🎛️ Panneau de Contrôle DJ</h2>

        <!-- Gestion libre des points -->
        <h3 style="margin-top: 1.5rem; color: var(--accent-orange); font-size: 1rem;">Attribution / Ajustement des points</h3>
        <table id="dj-leaderboard">
          <thead>
            <tr>
              <th>Équipe</th>
              <th>Pts actuels</th>
              <th>Attribuer / Modifier</th>
            </tr>
          </thead>
          <tbody>
            <!-- Rempli en JS -->
          </tbody>
        </table>

        <!-- QR Code direct -->
        <h3 style="margin-top: 2rem; color: var(--accent-orange); font-size: 1rem;">QR Code pour le public</h3>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">À afficher sur écran ou imprimer pour les tables.</p>
        <div style="text-align: center;">
          <div class="qr-container" id="qrcode"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Mot de passe DJ
    const ADMIN_PASS = "7314";

    // Liste des équipes (Animaux rares/originaux)
    const teamsList = [
      "Les Axolotls Rapides", "Les Narvals du Funk", "Les Pangolins Groove", "Les Quokkas Joyeux",
      "Les Tardigrades Invincibles", "Les Capybaras Zen", "Les Cassowary Rock", "Les Okapis Jazz",
      "Les Servals Disco", "Les Kakapos Chanteurs", "Les Fennecs Electros", "Les Dholes Rythmés"
    ];

    // Initialisation des scores
    let scores = JSON.parse(localStorage.getItem('blindtest_scores')) || {};

    // Initialiser les équipes si vide
    teamsList.forEach(team => {
      if (scores[team] === undefined) {
        scores[team] = 0;
      }
    });

    function saveScores() {
      localStorage.setItem('blindtest_scores', JSON.stringify(scores));
      renderLeaderboards();
    }

    // Charger les options d'équipes
    const selectElem = document.getElementById('team-select');
    teamsList.forEach(team => {
      const opt = document.createElement('option');
      opt.value = team;
      opt.textContent = team;
      selectElem.appendChild(opt);
    });

    // Envoi de réponse par un joueur
    function submitAnswer(e) {
      e.preventDefault();
      const team = document.getElementById('team-select').value;
      const answer = document.getElementById('player-answer').value;

      if (!team || !answer) return;

      alert(`Réponse envoyée pour "${team}" !
Le DJ valide les points dans son espace.`);
      document.getElementById('player-answer').value = '';
    }

    // Afficher les classements
    function renderLeaderboards() {
      const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);

      // Public
      const publicTbody = document.querySelector('#public-leaderboard tbody');
      publicTbody.innerHTML = '';
      sorted.forEach(([team, pts], index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : index + 1}</td>
          <td><strong>${team}</strong></td>
          <td>${pts} pt${pts > 1 ? 's' : ''}</td>
        `;
        publicTbody.appendChild(tr);
      });

      // Admin DJ (Avec attribution libre des points)
      const djTbody = document.querySelector('#dj-leaderboard tbody');
      if (djTbody) {
        djTbody.innerHTML = '';
        sorted.forEach(([team, pts]) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>${team}</strong></td>
            <td style="color: var(--accent-orange); font-weight: bold;">${pts}</td>
            <td>
              <div class="score-controls">
                <input type="number" step="0.5" class="score-input" id="input-${idSafe(team)}" placeholder="Ex: 1">
                <button class="btn-pts" onclick="addCustomPoints('${team}')">Ajouter</button>
                <button class="btn-quick" onclick="addPoints('${team}', 1)">+1</button>
                <button class="btn-quick" onclick="addPoints('${team}', 2)">+2</button>
                <button class="btn-quick" onclick="addPoints('${team}', 3)">+3</button>
              </div>
            </td>
          `;
          djTbody.appendChild(tr);
        });
      }
    }

    function idSafe(str) {
      return str.replace(/[^a-zA-Z0-9]/g, '_');
    }

    // Ajouter des points rapides (+1, +2, etc.)
    function addPoints(team, amount) {
      scores[team] = (scores[team] || 0) + amount;
      saveScores();
    }

    // Saisie libre du nombre de points
    function addCustomPoints(team) {
      const input = document.getElementById(`input-${idSafe(team)}`);
      const val = parseFloat(input.value);
      if (!isNaN(val)) {
        scores[team] = (scores[team] || 0) + val;
        saveScores();
      }
    }

    // Gestion Modal DJ
    function openDjModal() {
      document.getElementById('dj-modal').style.display = 'flex';
    }

    function closeDjModal() {
      document.getElementById('dj-modal').style.display = 'none';
    }

    function checkDjAuth() {
      const pass = document.getElementById('dj-pass').value;
      if (pass === ADMIN_PASS) {
        document.getElementById('dj-login').classList.add('hidden');
        document.getElementById('dj-dashboard').classList.remove('hidden');
        renderLeaderboards();
        generateQrCode();
      } else {
        alert("Mot de passe incorrect.");
      }
    }

    // Génération du QR Code automatique vers le lien de la page
    let qrGenerated = false;
    function generateQrCode() {
      if (qrGenerated) return;
      const url = window.location.href;
      new QRCode(document.getElementById("qrcode"), {
        text: url,
        width: 160,
        height: 160,
        colorDark : "#0f172a",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
      });
      qrGenerated = true;
    }

    // Premier affichage au chargement
    renderLeaderboards();
  </script>
</body>
</html>
